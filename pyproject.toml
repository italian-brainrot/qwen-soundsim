[project]
name = "soundsim"
version = "0.1.0"
description = "Physically based acoustic environment simulation with a media player"
requires-python = ">=3.11"
dependencies = [
    "ffmpeg-python>=0.2.0",
    "numpy>=2.0",
    "pyside6>=6.6",
    "pytest>=8.0",
    "scipy>=1.11",
    "sounddevice>=0.4",
    "soundfile>=0.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
